name: Publish ONDTF release

on:
  push:
    branches: [main]
    paths: [VERSION, RELEASE_NOTES.md, 'release/RELEASE-NOTES-v*.md', 'model/releases/v*.yaml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ondtf-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: pip install -r requirements-validation.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"; NOTES="release/RELEASE-NOTES-v$VERSION.md"; MODEL="model/releases/v$VERSION.yaml"
          test -f "$NOTES"; test -f "$MODEL"
          grep -Fq "$TAG" README.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
      - name: Validate repository
        run: make validate
      - name: Build and inspect documentation
        run: make site
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish latest stable release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "ONDTF $TAG — Stable Framework Specification" --notes-file "$NOTES" --latest
